# Micro-Manager Hardware Configuration file for the DEMO devices.
#
# This file wires up the DemoCamera adapter that ships with every
# Micro-Manager install so pymmcore-plus can be exercised without any
# real hardware. Load it via:
#
#     from pymmcore_plus import CMMCorePlus
#     mmc = CMMCorePlus.instance()
#     mmc.loadSystemConfiguration("docs/mm_demo_config.cfg")
#
# Format is comma-delimited (MM accepts tab or comma).

# Reset
Property,Core,Initialize,0

# Devices
Device,DHub,DemoCamera,DHub
Device,Camera,DemoCamera,DCam
Device,XY,DemoCamera,DXYStage
Device,Z,DemoCamera,DStage
Device,Objective,DemoCamera,DObjective
Device,Autofocus,DemoCamera,DAutoFocus
Device,Shutter,DemoCamera,DShutter

# Pre-init settings
Property,Camera,MaximumExposureMs,10000.0

# Hub (parent) references
Parent,Camera,DHub
Parent,XY,DHub
Parent,Z,DHub
Parent,Objective,DHub
Parent,Autofocus,DHub
Parent,Shutter,DHub

# Initialize
Property,Core,Initialize,1

# Delays (demo devices respond instantly)
Delay,Camera,0
Delay,XY,0
Delay,Z,0
Delay,Objective,0
Delay,Autofocus,0
Delay,Shutter,0

# Focus direction
FocusDirection,Z,0

# Core role assignments
Property,Core,Camera,Camera
Property,Core,XYStage,XY
Property,Core,Focus,Z
Property,Core,AutoFocus,Autofocus
Property,Core,Shutter,Shutter

# Objective labels
Label,Objective,5,Objective-5
Label,Objective,4,Objective-4
Label,Objective,3,Nikon 20X Plan Fluor ELWD
Label,Objective,2,Objective-2
Label,Objective,1,Nikon 10X S Fluor
Label,Objective,0,Nikon 40X Plan Fluor ELWD

# Camera default image geometry: 512x512, 16-bit
# (BitDepth/OnCameraCCDXSize/OnCameraCCDYSize are supported by DemoCamera's DCam)
Property,Camera,OnCameraCCDXSize,512
Property,Camera,OnCameraCCDYSize,512
Property,Camera,BitDepth,16
Property,Camera,PixelType,16bit
Property,Camera,Binning,1
Property,Camera,Exposure,100.0

# Configuration presets
# Group: Channel
ConfigGroup,Channel,Brightfield,Camera,Exposure,100.0

# Group: System (Startup preset used by MM to set initial state)
ConfigGroup,System,Startup,Camera,BitDepth,16
ConfigGroup,System,Startup,Camera,Binning,1
ConfigGroup,System,Startup,Core,ChannelGroup,Channel
